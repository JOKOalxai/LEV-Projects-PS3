name: Build LEV Projects PS3 PKG

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build PS3 homebrew package in PS3DEV container
        shell: bash
        run: |
          set -euo pipefail
          docker pull hldtux/ps3dev:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            hldtux/ps3dev:latest \
            bash -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          export PS3DEV="${PS3DEV:-/usr/local/ps3dev}"
          export PSL1GHT="${PSL1GHT:-$PS3DEV}"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          command -v ppu-gcc
          ppu-gcc --version | head -n 1
          command -v make

          if ! command -v git >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            apt-get update
            apt-get install -y git unzip
          fi

          git clone --depth 1 https://github.com/wargio/tiny3D.git /tmp/tiny3D
          make -C /tmp/tiny3D/lib install
          make -C /tmp/tiny3D/libfont install

          ZIP_FILE="/workspace/LEV_Projects_PS3_0.2.1_Source_Fixed.zip"
          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Source ZIP is missing or empty: $ZIP_FILE"
            echo "Files available in repository root:"
            find /workspace -maxdepth 2 -type f -printf '%p\n' | sort
            exit 2
          fi

          rm -rf /tmp/lev-project-source
          mkdir -p /tmp/lev-project-source
          unzip -q "$ZIP_FILE" -d /tmp/lev-project-source
          PROJECT_DIR="/tmp/lev-project-source/LEV_Projects_PS3_0.2"
          if [ ! -f "$PROJECT_DIR/Makefile" ]; then
            echo "::error::Could not find project Makefile under $PROJECT_DIR"
            find /tmp/lev-project-source -maxdepth 4 -type f -printf '%p\n' | sort
            exit 3
          fi

          cd "$PROJECT_DIR"
          echo "Building in: $PWD"
          make clean
          make -j2
          make pkg

          echo "Package/build outputs discovered:"
          find "$PROJECT_DIR" -type f \( -name '*.pkg' -o -name '*.self' -o -name '*.elf' \) -size +0c -print -exec ls -lh {} \;

          PKG_FILE="$(find "$PROJECT_DIR" -type f -name 'LEV_Projects_PS3.pkg' -size +0c -print -quit)"
          if [ -z "$PKG_FILE" ]; then
            echo "::error::make pkg completed but LEV_Projects_PS3.pkg was not found. See the output listing above."
            exit 4
          fi

          mkdir -p /workspace/dist
          cp "$PKG_FILE" /workspace/dist/LEV_Projects_PS3.pkg
          test -s /workspace/dist/LEV_Projects_PS3.pkg
          ls -lh /workspace/dist/LEV_Projects_PS3.pkg
          CONTAINER_SCRIPT

      - name: Show package file on runner
        if: always()
        shell: bash
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \( -name '*.pkg' -o -name '*.elf' -o -name '*.self' \) -print -exec ls -lh {} \; || true

      - name: Upload PS3 package artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEV-Projects-PS3-0.2-PKG
          path: dist/LEV_Projects_PS3.pkg
          if-no-files-found: error
