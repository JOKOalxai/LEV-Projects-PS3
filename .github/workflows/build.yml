name: Build LEV Projects PS3 PKG

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build PS3 homebrew package in PS3DEV container
        shell: bash
        run: |
          set -euo pipefail
          docker pull hldtux/ps3dev:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            hldtux/ps3dev:latest \
            bash -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          export PS3DEV="${PS3DEV:-/usr/local/ps3dev}"
          export PSL1GHT="${PSL1GHT:-$PS3DEV}"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          command -v ppu-gcc
          ppu-gcc --version | head -n 1
          command -v make

          if ! command -v git >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            apt-get update
            apt-get install -y git unzip
          fi

          git clone --depth 1 https://github.com/wargio/tiny3D.git /tmp/tiny3D
          make -C /tmp/tiny3D/lib install
          make -C /tmp/tiny3D/libfont install

          ZIP_FILE="/workspace/LEV_Projects_PS3_0.2.1_Source_Fixed.zip"
          test -f "$ZIP_FILE"
          rm -rf /tmp/lev-project-source
          mkdir -p /tmp/lev-project-source
          unzip -q "$ZIP_FILE" -d /tmp/lev-project-source
          cd /tmp/lev-project-source/LEV_Projects_PS3_0.2

          make clean
          make -j2
          make pkg
          test -s LEV_Projects_PS3.pkg
          cp LEV_Projects_PS3.pkg /workspace/LEV_Projects_PS3.pkg
          ls -lh /workspace/LEV_Projects_PS3.pkg
          CONTAINER_SCRIPT

      - name: Upload PS3 package artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEV-Projects-PS3-0.2-PKG
          path: LEV_Projects_PS3.pkg
          if-no-files-found: error
